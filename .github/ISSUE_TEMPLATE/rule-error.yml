name: 判定错误 / 结论不正确
description: 工具跑得通，但给出的判定或计算结果不对
title: "[规则] "
labels: ["rule-error"]
body:
  - type: markdown
    attributes:
      value: |
        **判定错误是本项目最高优先级的问题**，通常会在 72 小时内处理。
        请尽量提供可复现的最小输入，字段越完整处理越快。

  - type: input
    id: version
    attributes:
      label: 工具版本
      description: 运行 `<cli> --version` 的输出
      placeholder: "0.1.1"
    validations:
      required: true

  - type: input
    id: standard
    attributes:
      label: 涉及的标准 / 法条
      description: 例如 GB 7718-2025 4.1.2、民法典第 585 条
      placeholder: "GB 7718-2025 4.1.2"
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: 输入
      description: 触发问题的最小输入（可脱敏，但保留结构与数值）
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结论
      description: 你认为正确的判定，并简要说明依据
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结论
      description: 工具给出的结果（粘贴报告片段即可）
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 依据出处
      description: 标准正文段落、官方链接或截图。没有出处也可以提交，会由维护者核对。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认输入不含敏感个人信息
          required: true
