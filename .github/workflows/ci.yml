name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 2026-10-20（D39）：floor 由 3.8 抬到 3.12 —— PEP 639 的 license 表达式需要
        # setuptools>=77，而 setuptools 77 起自身要求 Python>=3.9；3.8 腿无法构建元数据。
        python: ["3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      # pyproject 的 addopts 已是 "-q"；这里不再叠 -q，否则变 "-qq" 会吞掉汇总行
      - name: Pytest
        run: python -m pytest

      - name: Smoke (console script)
        run: licaudit selftest --core

      - name: Smoke (module)
        run: python -m licaudit --version

      - name: Smoke (launcher)
        run: python scripts/launcher_licaudit.py --version

      # M1–M5：冻结数据必须能在干净环境里位级复现，且交付态入口真读得动
      - name: Frozen data check
        run: |
          python tools/fetch_spdx.py --check --out references/spdx
          python tools/gen_ruleset.py --check
          python tools/gen_synthetic.py --check
          python tools/gen_profile_truth.py --check
          python tools/gen_scenario_truth.py --check
          python tools/gen_conflict_truth.py --check
          python tools/gen_action_truth.py --check

      - name: Verify data and bench (M1–M5)
        run: |
          licaudit verify-data
          licaudit bench --only m1
          licaudit bench --only m2
          licaudit bench --only m3
          licaudit bench --only m4
          licaudit bench --only m5
